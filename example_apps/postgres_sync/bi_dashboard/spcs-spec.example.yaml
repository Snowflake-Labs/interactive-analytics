# Reference only. The real spec is GENERATED by `uv run render_spec.py`, which
# inlines the credentials from .env.cube into the containers' env blocks and
# writes .spcs-spec.rendered.yaml (gitignored).
#
# Credentials are injected at deploy time rather than baked into an image layer,
# so the images carry no secrets and can be rebuilt or shared freely.
#
# For Kubernetes instead of SPCS: `uv run render_spec.py --target k8s`.
spec:
  containers:
    - name: cube
      image: /<db>/<schema>/images/bi-cube:latest
      env:
        # ~50 CUBEJS_* / CUBE_* vars, filled in from .env.cube.
        CUBEJS_DATASOURCES: "default,sf,pg"
        # ...
      resources:
        requests: { memory: 2Gi, cpu: 1 }
        limits: { memory: 4Gi, cpu: 2 }

    - name: web
      image: /<db>/<schema>/images/bi-web:latest
      env:
        # Both containers share the service's network namespace, so the web app
        # reaches Cube on localhost.
        CUBE_API_URL: "http://localhost:4000/cubejs-api/v1"
        CUBEJS_API_SECRET: "<generated-per-run>"
      resources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 1Gi, cpu: 1 }

  endpoints:
    # Only the web app is public. Cube stays internal: it holds the Snowflake
    # credential and the Postgres password.
    - name: web
      port: 3000
      public: true
