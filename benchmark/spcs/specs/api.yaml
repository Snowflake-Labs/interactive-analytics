spec:
  containers:
    - name: api
      image: /${DB}/${SCHEMA}/${IMAGE_REPO}/${API_IMAGE}:${IMAGE_TAG}
      env:
        PORT: "${API_PORT}"
        SOLUTION_NAME: "${SOLUTION_NAME}"
        SNOWFLAKE_DATABASE: "${API_DATABASE}"
        SNOWFLAKE_ROLE: "${API_ROLE}"
        SNOWFLAKE_WAREHOUSE: "${API_WAREHOUSE}"
        INTERACTIVE_WAREHOUSE: "${INTERACTIVE_WAREHOUSE}"
        STANDARD_WAREHOUSE: "${STANDARD_WAREHOUSE}"
        INTERACTIVE_SCHEMA: "${INTERACTIVE_SCHEMA}"
        STANDARD_SCHEMA: "${STANDARD_SCHEMA}"
        POOL_SIZE: "${POOL_SIZE}"
        POOL_WARMUP: "${API_POOL_WARMUP}"
        POOL_ACQUIRE_TIMEOUT: "${API_POOL_ACQUIRE_TIMEOUT}"
        WORKERS: "${API_WORKERS}"
      resources:
        requests:
          memory: "${API_MEMORY_REQUEST}"
          cpu: "${API_CPU_REQUEST}"
        limits:
          memory: "${API_MEMORY_LIMIT}"
          cpu: "${API_CPU_LIMIT}"
      readinessProbe:
        port: ${API_PORT}
        path: /api/health
  endpoints:
    - name: web
      port: ${API_PORT}
      public: true
      protocol: HTTP
