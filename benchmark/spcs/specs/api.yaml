spec:
  containers:
    - name: api
      image: /${DB}/${SCHEMA}/${IMAGE_REPO}/${API_IMAGE}:${IMAGE_TAG}
      env:
        PORT: "${API_PORT}"
        SOLUTION_NAME: "${SOLUTION_NAME}"
        SNOWFLAKE_DATABASE: "${API_DATABASE}"
        SNOWFLAKE_ROLE: "${API_ROLE}"
        SNOWFLAKE_WAREHOUSE: "${API_WAREHOUSE}"
        INTERACTIVE_WAREHOUSE: "${INTERACTIVE_WAREHOUSE}"
        STANDARD_WAREHOUSE: "${STANDARD_WAREHOUSE}"
        INTERACTIVE_SCHEMA: "${INTERACTIVE_SCHEMA}"
        STANDARD_SCHEMA: "${STANDARD_SCHEMA}"
      resources:
        requests:
          memory: 1Gi
          cpu: "500m"
        limits:
          memory: 2Gi
          cpu: "1000m"
      readinessProbe:
        port: ${API_PORT}
        path: /api/health
  endpoints:
    - name: web
      port: ${API_PORT}
      public: true
      protocol: HTTP
