spec:
  containers:
    - name: dashboard
      image: /${DB}/${SCHEMA}/${IMAGE_REPO}/${DASHBOARD_IMAGE}:${IMAGE_TAG}
      env:
        PORT: "${DASHBOARD_PORT}"
        SOLUTION_NAME: "${SOLUTION_NAME}"
        DASHBOARD_DATABASE: "${DASHBOARD_DATABASE}"
        DASHBOARD_ROLE: "${DASHBOARD_ROLE}"
        DASHBOARD_WAREHOUSE: "${DASHBOARD_WAREHOUSE}"
        SNOWFLAKE_DATABASE: "${DASHBOARD_DATABASE}"
        SNOWFLAKE_ROLE: "${DASHBOARD_ROLE}"
        SNOWFLAKE_WAREHOUSE: "${DASHBOARD_WAREHOUSE}"
        INTERACTIVE_WAREHOUSE: "${INTERACTIVE_WAREHOUSE}"
        STANDARD_WAREHOUSE: "${STANDARD_WAREHOUSE}"
        INTERACTIVE_SCHEMA: "${INTERACTIVE_SCHEMA}"
        STANDARD_SCHEMA: "${STANDARD_SCHEMA}"
      resources:
        requests:
          memory: 1Gi
          cpu: "500m"
        limits:
          memory: 2Gi
          cpu: "1000m"
      readinessProbe:
        port: ${DASHBOARD_PORT}
        path: /api/health
  endpoints:
    - name: web
      port: ${DASHBOARD_PORT}
      public: true
      protocol: HTTP
