spec:
  containers:
    - name: api
      image: /${IMAGE_DB}/${IMAGE_SCHEMA}/${IMAGE_REPO}/${BENCHMARK_IMAGE}:${IMAGE_TAG}
      env:
        BENCHMARK_ROLE: "api"
        PORT: "${API_PORT}"
        SOLUTION_NAME: "${SOLUTION_NAME}"
        SNOWFLAKE_DATABASE: "${API_DATABASE}"
        SNOWFLAKE_ROLE: "${API_ROLE}"
        SNOWFLAKE_WAREHOUSE: "${API_WAREHOUSE}"
        INTERACTIVE_WAREHOUSE: "${INTERACTIVE_WAREHOUSE}"
        INTERACTIVE_SCHEMA: "${INTERACTIVE_SCHEMA}"
        QUERY_TAG: "${SOLUTION_NAME}"
        POOL_SIZE: "${POOL_SIZE}"
        POOL_WARMUP: "${API_POOL_WARMUP}"
        POOL_ACQUIRE_TIMEOUT: "${API_POOL_ACQUIRE_TIMEOUT}"
        WORKERS: "${API_WORKERS}"
      resources:
        requests:
          memory: "${API_MEMORY_REQUEST}"
          cpu: "${API_CPU_REQUEST}"
        limits:
          memory: "${API_MEMORY_LIMIT}"
          cpu: "${API_CPU_LIMIT}"
      volumeMounts:
        - name: queries
          mountPath: /app/test
      readinessProbe:
        port: ${API_PORT}
        path: /api/ready
  volumes:
    - name: queries
      source: "@${DB}.${SCHEMA}.${QUERIES_STAGE}"
      # Match the image's non-root runtime so staged SQL files are readable.
      uid: 65532
      gid: 65532
  endpoints:
    - name: web
      port: ${API_PORT}
      public: true
      protocol: HTTP
